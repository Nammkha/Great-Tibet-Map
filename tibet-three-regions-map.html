<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive map of Tibet — Ü-Tsang, Kham and Amdo</title>
<meta name="description" content="Interactive map of the three regions of Tibet: Ü-Tsang, Kham and Amdo. Bilingual labels, area figures and an overlay of present-day borders.">
<link rel="canonical" href="https://nammkha.github.io/Great-Tibet-Map/">
<meta name="theme-color" content="#0B1117">
<meta property="og:type" content="website">
<meta property="og:title" content="Map of Tibet: Ü-Tsang, Kham and Amdo">
<meta property="og:description" content="An interactive map of the three traditional regions of Tibet. Free, open source, embeddable in any site.">
<meta property="og:url" content="https://nammkha.github.io/Great-Tibet-Map/">
<meta property="og:image" content="https://nammkha.github.io/Great-Tibet-Map/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="tibet-three-regions-dark.svg" type="image/svg+xml">
<style>
  html,body{margin:0;padding:0;background:#080d12;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;}
  @media (max-width:640px){body{padding:0;}}
</style>
</head>
<body>

<!-- ══════════ COPY FROM HERE ══════════ -->
<div class="tibmap" id="tibet-map"
     data-theme="dark"
     data-labels="both"
     data-admin="false"
     data-cities="true"
     data-inset="true"
     data-selected="">
  <noscript><p style="padding:24px;color:#8FA0AC;font:15px/1.5 system-ui">
    This map needs JavaScript. A static version is available as
    <code>tibet-three-regions.svg</code>.</p></noscript>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+Tibetan:wght@400;600&display=swap');

.tibmap{
  /* ── palette: thangka mineral pigments ───────────────────── */
  --tm-utsang:#B23A48;   /* btsod — madder   */
  --tm-kham:#2F6E8F;     /* mthing — azurite */
  --tm-amdo:#3F8F6B;     /* spang — malachite*/
  --tm-gold:#D9A441;     /* gser             */

  --tm-bg:#0B1117;
  --tm-land:#18222B;
  --tm-land-2:#212C36;
  --tm-hair:#31404B;
  --tm-ink:#EFE7D8;
  --tm-ink-dim:#8FA0AC;
  --tm-rule:#22303A;
  --tm-panel:#101922;

  --tm-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --tm-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tm-bo:'Noto Serif Tibetan','Kailasa','Microsoft Himalaya',serif;

  --tm-radius:2px;
  --tm-max:1180px;

  box-sizing:border-box;
  width:100%;
  max-width:var(--tm-max);
  margin:0 auto;
  background:var(--tm-bg);
  color:var(--tm-ink);
  font-family:var(--tm-ui);
  font-size:15px;
  line-height:1.55;
  border:1px solid var(--tm-rule);
  border-radius:var(--tm-radius);
  overflow:hidden;
  container-type:inline-size;
}
.tibmap *,.tibmap *::before,.tibmap *::after{box-sizing:border-box;}

.tibmap[data-theme="light"]{
  --tm-utsang:#A6303F;
  --tm-kham:#2A6182;
  --tm-amdo:#347C5B;
  --tm-gold:#A87A18;
  --tm-bg:#F7F4EE;
  --tm-land:#E4DFD4;
  --tm-land-2:#D8D2C5;
  --tm-hair:#BDB6A6;
  --tm-ink:#1A1712;
  --tm-ink-dim:#6B6558;
  --tm-rule:#D2CBBC;
  --tm-panel:#FFFDF8;
}

/* ── header ──────────────────────────────────────────────── */
.tibmap__head{padding:26px 28px 20px;border-bottom:1px solid var(--tm-rule);}
.tibmap__eyebrow{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tm-gold);margin-bottom:10px;
}
.tibmap__eyebrow b{font-family:var(--tm-bo);font-size:17px;letter-spacing:0;font-weight:400;line-height:1;}
.tibmap__title{
  font-family:var(--tm-display);font-weight:600;
  font-size:clamp(26px,4.4cqw,40px);line-height:1.06;letter-spacing:-.015em;
  margin:0 0 8px;
}
.tibmap__standfirst{margin:0;max-width:62ch;color:var(--tm-ink-dim);font-size:14.5px;}

/* ── signature: the proportion bar / legend / selector ────── */
.tibmap__bar{display:flex;width:100%;margin-top:20px;gap:2px;}
.tibmap__seg{
  appearance:none;border:0;padding:0;cursor:pointer;text-align:left;
  background:transparent;color:inherit;font:inherit;
  display:block;position:relative;
  transition:opacity .25s ease;
}
.tibmap__seg:focus-visible{outline:2px solid var(--tm-gold);outline-offset:3px;}
.tibmap__seg i{
  display:block;height:8px;background:var(--tm-c);
  transition:height .25s ease,filter .25s ease;
}
.tibmap__seg:hover i,.tibmap__seg[aria-pressed="true"] i{height:14px;}
.tibmap__seg u{
  display:block;text-decoration:none;padding-top:9px;
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tibmap__seg s{
  display:block;text-decoration:none;
  font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--tm-ink-dim);
}
.tibmap[data-active]:not([data-active=""]) .tibmap__seg[aria-pressed="false"]{opacity:.4;}

/* ── body grid ───────────────────────────────────────────── */
.tibmap__body{display:grid;grid-template-columns:minmax(0,1fr) 316px;}
@container (max-width:900px){ .tibmap__body{grid-template-columns:minmax(0,1fr);} }

.tibmap__stage{position:relative;background:var(--tm-bg);min-width:0;display:flex;align-items:center;}
.tibmap__svg{display:block;width:100%;height:auto;}

/* ── map layers ──────────────────────────────────────────── */
.tibmap .tm-sea{fill:var(--tm-bg);}
.tibmap .tm-grat{fill:none;stroke:var(--tm-hair);stroke-width:.6;opacity:.35;}
.tibmap .tm-neigh{fill:var(--tm-land);stroke:var(--tm-hair);stroke-width:1;stroke-linejoin:round;}
.tibmap .tm-china{fill:var(--tm-land-2);stroke:var(--tm-hair);stroke-width:1;stroke-linejoin:round;}
.tibmap .tm-neighline{fill:none;stroke:var(--tm-hair);stroke-width:1;}
.tibmap .tm-admin{fill:none;stroke:var(--tm-ink);stroke-opacity:.42;stroke-width:1.4;stroke-dasharray:7 5;}
.tibmap .tm-outline{fill:none;stroke:var(--tm-gold);stroke-width:2.4;stroke-linejoin:round;pointer-events:none;}
.tibmap .tm-regions{filter:url(#tmLift);}
.tibmap .tm-halo{fill:none;stroke:var(--tm-bg);stroke-width:9;stroke-linejoin:round;opacity:.85;pointer-events:none;}

.tibmap .tm-region{
  stroke:var(--tm-bg);stroke-width:1.2;stroke-linejoin:round;
  cursor:pointer;
  transition:filter .3s ease,opacity .3s ease;
}
.tibmap .tm-region:focus{outline:none;}
.tibmap .tm-region:focus-visible{stroke:var(--tm-gold);stroke-width:3;}
.tibmap .tm-utsang{fill:var(--tm-utsang);}
.tibmap .tm-kham{fill:var(--tm-kham);}
.tibmap .tm-amdo{fill:var(--tm-amdo);}
.tibmap .tm-tex{pointer-events:none;}

.tibmap[data-active]:not([data-active=""]) .tm-region:not(.is-on){opacity:.34;filter:saturate(.45);}
.tibmap .tm-region.is-on{filter:brightness(1.16);}

/* map typography */
.tibmap .tm-ctry{
  fill:var(--tm-ink-dim);font-family:var(--tm-ui);font-weight:500;
  letter-spacing:.2em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.7;stroke-width:4px;
}
.tibmap .tm-k-C{font-size:21px;letter-spacing:.26em;opacity:.95;font-weight:600;}
.tibmap .tm-k-c{font-size:14px;opacity:.75;}
.tibmap .tm-k-p{font-size:15px;opacity:.6;font-style:italic;letter-spacing:.1em;
  font-family:var(--tm-display);text-transform:none;}
.tibmap .tm-rname{
  fill:var(--tm-ink);font-family:var(--tm-display);font-weight:600;font-size:34px;
  letter-spacing:.02em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:rgba(0,0,0,.32);stroke-width:4px;
}
.tibmap[data-theme="light"] .tm-rname{stroke:rgba(255,255,255,.45);}
.tibmap .tm-rbo{
  fill:var(--tm-ink);font-family:var(--tm-bo);font-size:27px;text-anchor:middle;
  pointer-events:none;opacity:.9;
  paint-order:stroke;stroke:rgba(0,0,0,.3);stroke-width:4px;
}
.tibmap[data-theme="light"] .tm-rbo{stroke:rgba(255,255,255,.45);}
.tibmap .tm-city{fill:var(--tm-ink);}
.tibmap .tm-cityring{fill:none;stroke:var(--tm-ink);stroke-opacity:.55;}
.tibmap .tm-cname{
  fill:var(--tm-ink);font-family:var(--tm-ui);font-size:16px;font-weight:500;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.75;stroke-width:4px;
}
.tibmap .tm-cbo{
  fill:var(--tm-ink);font-family:var(--tm-bo);font-size:14px;opacity:.72;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.7;stroke-width:3.5px;
}
.tibmap[data-cities="false"] .tm-cities{display:none;}
.tibmap[data-admin="false"] .tm-adminlayer{display:none;}
.tibmap[data-labels="en"] .tm-bo-only{display:none;}
.tibmap[data-labels="bo"] .tm-en-only{display:none;}

/* ── panel ───────────────────────────────────────────────── */
.tibmap__panel{
  border-left:1px solid var(--tm-rule);background:var(--tm-panel);
  padding:24px 24px 22px;display:flex;flex-direction:column;gap:16px;min-width:0;
}
@container (max-width:900px){ .tibmap__panel{border-left:0;border-top:1px solid var(--tm-rule);} }

.tibmap__mark{width:34px;height:3px;background:var(--tm-c,var(--tm-gold));}
.tibmap__pname{font-family:var(--tm-display);font-size:27px;font-weight:600;line-height:1.1;margin:0;}
.tibmap__pbo{font-family:var(--tm-bo);font-size:20px;line-height:1.9;margin:2px 0 0;color:var(--tm-gold);}
.tibmap__pkicker{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--tm-ink-dim);margin:0;
}
.tibmap__pdesc{margin:0;font-size:14px;color:var(--tm-ink);opacity:.88;}
.tibmap__facts{margin:0;padding:0;list-style:none;border-top:1px solid var(--tm-rule);}
.tibmap__facts li{
  display:flex;justify-content:space-between;gap:14px;
  padding:8px 0;border-bottom:1px solid var(--tm-rule);font-size:13px;
}
.tibmap__facts dt,.tibmap__facts span:first-child{color:var(--tm-ink-dim);letter-spacing:.04em;}
.tibmap__facts span:last-child{text-align:right;font-variant-numeric:tabular-nums;}
.tibmap__quote{
  margin:0;padding:14px 0 0;border-top:1px solid var(--tm-rule);
  font-family:var(--tm-display);font-size:15px;line-height:1.45;color:var(--tm-ink);opacity:.9;
}
.tibmap__quote cite{display:block;margin-top:7px;font:400 11px/1.4 var(--tm-ui);
  letter-spacing:.16em;text-transform:uppercase;color:var(--tm-ink-dim);font-style:normal;}

/* ── controls + note ─────────────────────────────────────── */
.tibmap__foot{
  border-top:1px solid var(--tm-rule);padding:14px 28px 20px;
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;
}
.tibmap__ctrl{
  appearance:none;background:transparent;border:1px solid var(--tm-rule);
  color:var(--tm-ink-dim);font:500 11px/1 var(--tm-ui);letter-spacing:.14em;text-transform:uppercase;
  padding:8px 12px;border-radius:var(--tm-radius);cursor:pointer;
  transition:color .2s,border-color .2s;
}
.tibmap__ctrl:hover{color:var(--tm-ink);border-color:var(--tm-hair);}
.tibmap__ctrl[aria-pressed="true"]{color:var(--tm-gold);border-color:var(--tm-gold);}
.tibmap__ctrl:focus-visible{outline:2px solid var(--tm-gold);outline-offset:2px;}
.tibmap__note{
  padding:0 28px 24px;margin:0;font-size:11.5px;line-height:1.65;
  color:var(--tm-ink-dim);max-width:88ch;
}
.tibmap__note b{color:var(--tm-ink);font-weight:500;}

.tibmap .tm-inset-frame{fill:var(--tm-bg);stroke:var(--tm-rule);stroke-width:1.5;}
.tibmap .tm-inset-world{fill:var(--tm-land-2);stroke:var(--tm-hair);stroke-width:.5;}
.tibmap .tm-inset-tib{fill:var(--tm-gold);stroke:var(--tm-gold);stroke-width:1.6;stroke-linejoin:round;}
.tibmap .tm-inset-ring{fill:none;stroke:var(--tm-gold);stroke-width:1.2;opacity:.85;}
.tibmap .tm-inset-cap{fill:var(--tm-ink-dim);font-family:var(--tm-ui);font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;}
.tibmap[data-inset="false"] .tm-insetlayer{display:none;}

.tibmap__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ── small containers: bigger map type, less clutter ─────── */
@container (max-width:760px){
  .tibmap__head{padding:20px 18px 16px;}
  .tibmap__foot{padding:12px 18px 16px;gap:8px 14px;}
  .tibmap__note{padding:0 18px 20px;}
  .tibmap__panel{padding:20px 18px;}
  .tibmap__seg s{display:none;}
  .tibmap__seg u{font-size:10.5px;letter-spacing:.1em;}
  .tibmap .tm-rname{font-size:60px;stroke-width:7px;}
  .tibmap .tm-rbo{font-size:50px;stroke-width:7px;}
  .tibmap .tm-k-C{font-size:30px;letter-spacing:.16em;}
  .tibmap .tm-k-c{display:none;}
  .tibmap .tm-cname{font-size:31px;stroke-width:6px;}
  .tibmap .tm-insetlayer{display:none;}
  .tibmap .tm-city{r:6;}
  .tibmap .tm-cityring{r:13;stroke-width:2;}
  .tibmap .tm-cityitem[data-key="0"]{display:none;}
  .tibmap .tm-cbo{display:none;}
  .tibmap .tm-k-p{display:none;}
  .tibmap .tm-rbo{transform:translateY(26px);}
  .tibmap .tm-region{stroke-width:2;}
  .tibmap .tm-outline{stroke-width:3.4;}
  .tibmap .tm-admin{stroke-width:2.4;stroke-dasharray:11 8;}
}
@media (prefers-reduced-motion:reduce){
  .tibmap *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}
</style>

      '</svg>'+
    '</div>'+
    '<aside class="tibmap__panel" id="tibmap-panel" aria-live="polite"></aside>'+
  '</div>'+
  '<div class="tibmap__foot">'+
    '<button class="tibmap__ctrl" type="button" data-act="labels">Labels: Both</button>'+
    '<button class="tibmap__ctrl" type="button" data-act="admin" aria-pressed="false">Current borders</button>'+
    '<button class="tibmap__ctrl" type="button" data-act="cities" aria-pressed="true">Towns</button>'+
    '<button class="tibmap__ctrl" type="button" data-act="inset" aria-pressed="true">Locator</button>'+'<button class="tibmap__ctrl" type="button" data-act="theme">Light</button>'+
    '<button class="tibmap__ctrl" type="button" data-act="reset">Clear selection</button>'+
  '</div>'+
  '<p class="tibmap__note"><b>About these boundaries.</b> Ü-Tsang, Kham and Amdo are traditional cultural regions, not present-day administrative units. The outlines here are built by grouping today\u2019s prefectures and are indicative rather than authoritative — the historical limits were never surveyed, shifted over time, and are drawn differently by different sources, particularly along the Gyalrong, Kongpo and Kokonor margins. Every line drawn here — the region outlines and the <b>Current borders</b> overlay alike — follows the internationally recognised boundary. Territory administered by India — Arunachal Pradesh, Ladakh and Jammu &amp; Kashmir — and by Nepal, Bhutan, Bangladesh and Myanmar lies outside every boundary shown on this map. Along the northern rim the Changthang and Hoh Xil run on into Xinjiang and Gansu, so that edge is drawn as the continuous landform rather than as the ragged limit of the Tibetan prefectures. Today the same ground is divided among the Tibet Autonomous Region and parts of Qinghai, Sichuan, Gansu and Yunnan; switch on <b>Current borders</b> to see them.</p>';

  /* ── behaviour ──────────────────────────────────────── */
  var panel=root.querySelector('#tibmap-panel');
  var listeners=[];
  var LABEL_MODES=['both','en','bo'], LABEL_TEXT={both:'Both',en:'English',bo:'Tibetan'};

  function renderPanel(k){
    if(!k){
      panel.innerHTML =
        '<div class="tibmap__mark" style="--tm-c:var(--tm-gold)"></div>'+
        '<p class="tibmap__pkicker">Chöl-kha-sum</p>'+
        '<h3 class="tibmap__pname">Three regions, one plateau</h3>'+
        '<p class="tibmap__pdesc">Tibetans have long described their country in three parts, each with its own dialect, landscape and reputation. Select a region on the map or in the bar above.</p>'+
        '<ul class="tibmap__facts">'+
          '<li><span>Combined area</span><span>'+fmt(total)+' km²</span></li>'+
          '<li><span>Mean elevation</span><span>≈ 4,500 m</span></li>'+
          '<li><span>Regions shown</span><span>3</span></li>'+
        '</ul>'+
        '<blockquote class="tibmap__quote">The best religion from Ü-Tsang, the best men from Kham, the best horses from Amdo.<cite>Tibetan saying</cite></blockquote>';
      return;
    }
    var r=REGIONS[k], d=DATA.regions[k];
    panel.innerHTML =
      '<div class="tibmap__mark" style="--tm-c:var(--tm-'+k+')"></div>'+
      '<div>'+
        '<p class="tibmap__pkicker">'+r.kicker+'</p>'+
        '<h3 class="tibmap__pname">'+r.name+'</h3>'+
        '<p class="tibmap__pbo">'+r.bo+'</p>'+
      '</div>'+
      '<p class="tibmap__pdesc">'+r.desc+'</p>'+
      '<ul class="tibmap__facts">'+
        '<li><span>Area</span><span>'+fmt(d.areaKm2)+' km²</span></li>'+
        '<li><span>Share of Tibet</span><span>'+(d.areaKm2/total*100).toFixed(1)+'%</span></li>'+
        r.facts.map(function(f){return '<li><span>'+f[0]+'</span><span>'+f[1]+'</span></li>';}).join('')+
        '<li><span>Today</span><span>'+r.today+'</span></li>'+
      '</ul>';
  }

  function select(k){
    if(k && !REGIONS[k]) return;
    root.setAttribute('data-active',k||'');
    root.setAttribute('data-selected',k||'');
    ORDER.forEach(function(id){
      var on=id===k;
      root.querySelectorAll('[data-region="'+id+'"]').forEach(function(el){
        el.setAttribute('aria-pressed',on?'true':'false');
        el.classList.toggle('is-on',on);
      });
    });
    renderPanel(k);
    listeners.forEach(function(fn){try{fn(k||null);}catch(e){}});
  }

  root.addEventListener('click',function(e){
    var t=e.target.closest('[data-region]');
    if(t){ var k=t.getAttribute('data-region');
      select(root.getAttribute('data-selected')===k?'':k); return; }
    var c=e.target.closest('[data-act]');
    if(!c) return;
    var a=c.getAttribute('data-act');
    if(a==='reset') select('');
    if(a==='admin'){ var on=root.getAttribute('data-admin')!=='true';
      root.setAttribute('data-admin',on); c.setAttribute('aria-pressed',on); }
    if(a==='cities'){ var on2=root.getAttribute('data-cities')!=='true';
      root.setAttribute('data-cities',on2); c.setAttribute('aria-pressed',on2); }
    if(a==='inset'){ var on3=root.getAttribute('data-inset')!=='true';
      root.setAttribute('data-inset',on3); c.setAttribute('aria-pressed',on3); }
    if(a==='labels'){ var cur=root.getAttribute('data-labels')||'both';
      var nx=LABEL_MODES[(LABEL_MODES.indexOf(cur)+1)%3];
      root.setAttribute('data-labels',nx); c.textContent='Labels: '+LABEL_TEXT[nx]; }
    if(a==='theme'){ var lt=root.getAttribute('data-theme')!=='light';
      root.setAttribute('data-theme',lt?'light':'dark'); c.textContent=lt?'Dark':'Light'; }
  });

  root.addEventListener('keydown',function(e){
    var t=e.target.closest('.tm-region'); if(!t) return;
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); t.click(); }
  });

  var hoverTimer;
  root.querySelectorAll('.tm-region').forEach(function(p){
    p.addEventListener('mouseenter',function(){
      if(root.getAttribute('data-selected')) return;
      clearTimeout(hoverTimer);
      root.setAttribute('data-active',p.getAttribute('data-region'));
      p.classList.add('is-on');
      renderPanel(p.getAttribute('data-region'));
    });
    p.addEventListener('mouseleave',function(){
      if(root.getAttribute('data-selected')) return;
      p.classList.remove('is-on');
      hoverTimer=setTimeout(function(){
        if(!root.getAttribute('data-selected')){root.setAttribute('data-active','');renderPanel('');}
      },90);
    });
  });

  if(root.getAttribute('data-theme')==='auto'){
    var mq=window.matchMedia('(prefers-color-scheme: light)');
    var apply=function(){root.setAttribute('data-theme',mq.matches?'light':'dark');};
    apply(); mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply);
  }
  if(!root.hasAttribute('data-inset')) root.setAttribute('data-inset','true');
  root.querySelector('[data-act="inset"]').setAttribute('aria-pressed',root.getAttribute('data-inset')!=='false');
  root.querySelector('[data-act="admin"]').setAttribute('aria-pressed',root.getAttribute('data-admin')==='true');
  root.querySelector('[data-act="cities"]').setAttribute('aria-pressed',root.getAttribute('data-cities')!=='false');
  root.querySelector('[data-act="labels"]').textContent='Labels: '+(LABEL_TEXT[root.getAttribute('data-labels')]||'Both');
  select(root.getAttribute('data-selected')||'');

  window.TibetMap={
    select:select,
    get:function(){return root.getAttribute('data-selected')||null;},
    on:function(fn){listeners.push(fn);return this;},
    setTheme:function(t){root.setAttribute('data-theme',t);},
    regions:REGIONS,
    data:DATA
  };
})();
</script>

<script>

if (window.parent !== window && window.ResizeObserver) {
  new ResizeObserver(function () {
